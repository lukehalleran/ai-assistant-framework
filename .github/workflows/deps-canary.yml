name: Dependency canary

# Weekly early warning, NOT a required check and NOT part of tests.yml.
# It installs the NEWEST versions of every dependency (no -c requirements.lock.txt)
# and runs the fast unit lane. A red run is a GitHub notification email that an
# upstream release would break a fresh unconstrained install; nothing is blocked
# (tests.yml installs under the lock). The fix is either a pin in requirements.txt
# or a deliberate `python scripts/refresh_lock.py` after the breakage is resolved.
# torch/torchvision are the exception to "newest": torch is pinned in requirements.txt and
# is bumped deliberately, never by the canary (the pinned CPU build is installed first).
# Class: floating transitive dependencies (2026-10-24 preshed 3.0.14 incident).

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the newest dependency versions (no lock)
        run: |
          python -m pip install --upgrade pip
          # torch is the one exception: requirements.txt pins it and the PyPI wheel is
          # the CUDA build (too big for the runner), so install the pinned CPU build
          # first. torchvision is not in requirements.txt; its version comes from the lock.
          TORCH_VER=$(sed -n 's/^torch==//p' requirements.txt)
          TV_VER=$(sed -n 's/^torchvision==//p' requirements.lock.txt)
          python -m pip install --no-cache-dir \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==${TORCH_VER}+cpu" "torchvision==${TV_VER}+cpu"
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir pytest pytest-asyncio pytest-cov fpdf2 ruff
          python -m spacy download en_core_web_sm
          python -c "import spacy; nlp = spacy.load('en_core_web_sm'); assert [t.lemma_ for t in nlp('clusters ate')] == ['cluster', 'eat']"
          python -m pip check

      - name: Freeze and diff against the lock (informational)
        run: |
          python -m pip freeze > freeze.txt
          # Names normalized (lowercase, _ and . -> -) and local labels (+cpu) stripped
          # so only real version differences show; informational only.
          norm() { sed -E 's/\+[A-Za-z0-9.]+$//' | tr 'A-Z' 'a-z' | sed -E 's/^([^=]+)==/\1==/' \
            | awk -F'==' 'NF==2 { gsub(/[_.]/, "-", $1); print $1 "==" $2 }' | sort; }
          norm < freeze.txt > freeze.sorted
          grep -v '^#' requirements.lock.txt | norm > lock.sorted
          diff lock.sorted freeze.sorted || true

      - name: Upload freeze
        uses: actions/upload-artifact@v4
        with:
          name: canary-freeze
          path: freeze.txt
          retention-days: 30

      - name: Fast unit lane on the newest versions
        run: python -m pytest -q -m "not slow and not benchmark and not semantic" tests/unit
        env:
          OPENAI_API_KEY: "sk-test-placeholder"
          CHROMA_DEVICE: "cpu"
