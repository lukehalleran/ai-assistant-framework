name: Tests

# One required status lands a change on master: bug-class-gate. It needs every
# other job in this workflow, runs even when one of them failed or was
# skipped, rejects any dependency result other than success, and re-verifies
# the scan and JUnit receipts against the checked-out policy for this commit.
# GitHub treats skipped and neutral checks as satisfying a required status, so
# the gate cannot be conditional itself and cannot trust job colours alone.
# The enforcement wiring is tested by tests/bug_class_guards/test_enforcement.py.

on:
  push:
    branches: [master, refactor/prompt-modular]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  bug-class-scan:
    name: bug-class-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the isolated harness runner (the lane itself is stdlib-only)
        run: python -m pip install --no-cache-dir pytest==9.0.2

      - name: Full bug-class scan (policy contract, every input leg)
        run: |
          set -euo pipefail
          mkdir -p receipts
          python scripts/check_bug_classes.py scan --root . --receipt receipts/bug-class-scan.json

      - name: Isolated bug-class harness
        run: |
          set -euo pipefail
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q -p no:cacheprovider \
            --confcutdir=tests/bug_class_guards --junitxml=receipts/bug-class-harness.xml \
            tests/bug_class_guards

      - name: Upload bug-class receipts
        uses: actions/upload-artifact@v4
        with:
          name: bug-class-receipts
          path: receipts/
          if-no-files-found: error
          retention-days: 30

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The default PyPI torch wheel pulls the full CUDA stack and exceeds
          # the disk available on GitHub's CPU-only runner.
          python -m pip install --no-cache-dir \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.7.1+cpu torchvision==0.22.1+cpu
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir pytest pytest-asyncio pytest-cov fpdf2 ruff
          python -m spacy download en_core_web_sm
          python -m pip check
          python -c 'import open_clip, torch, torchvision; assert torch.__version__.startswith("2.7.1+cpu"); assert torchvision.__version__.startswith("0.22.1+cpu"); assert not torch.cuda.is_available()'

      - name: Privacy guard (test fixtures/docs for medication dosages and fixture size)
        run: |
          set -euo pipefail

          # Real-memory fixtures are local-only regardless of size. Search the
          # Git index so ignored local fixtures cannot enter CI output.
          tracked_real=$(git ls-files 'tests/fixtures/*_real*.yaml')
          if [ -n "$tracked_real" ]; then
            echo "ERROR: Real-memory benchmark fixture paths are tracked:"
            printf '%s\n' "$tracked_real"
            exit 1
          fi

          # The reviewed synthetic retrieval suite is currently ~2.3K lines;
          # the cap catches accidental bulk fixture additions without rejecting it.
          while IFS= read -r f; do
            if [ "$(wc -l < "$f")" -gt 2500 ]; then
              echo "ERROR: Test fixture $f exceeds 2500 lines"
              exit 1
            fi
          done < <(git ls-files 'tests/fixtures/*.yaml')

          # Dosage-shaped text is reviewed by exact tracked path. Report paths
          # only (never matching lines) and fail closed on anything new.
          unexpected=()
          while IFS= read -r f; do
            case "$f" in
              docs/ARCHITECTURE_GUIDE.md|docs/PROJECT_SKELETON.md|docs/QUICK_REFERENCE.md|tests/test_web_search_trigger.py|tests/unit/test_anaphoric_continuation.py|tests/unit/test_correction_gui_wiring.py|tests/unit/test_cross_section_dedup_role_labels.py|tests/unit/test_graph_integration.py)
                ;;
              *) unexpected+=("$f") ;;
            esac
          done < <(git grep -IlE '[0-9]{3,4}[[:space:]]*mg([^[:alnum:]_]|$)' -- tests docs)
          if [ "${#unexpected[@]}" -gt 0 ]; then
            echo "ERROR: Dosage-shaped text found in unreviewed tracked paths:"
            printf '  %s\n' "${unexpected[@]}"
            exit 1
          fi

      - name: Lint (bug-focused floor — rules in pyproject [tool.ruff])
        run: python -m ruff check .

      - name: Five repo-wide guards (always selected, JUnit receipt)
        run: |
          set -euo pipefail
          mkdir -p receipts
          python -m pytest -q -p no:cacheprovider --junitxml=receipts/repo-wide-guards.xml \
            tests/unit/test_no_git_state_in_tests.py \
            tests/unit/test_ordered_slice_guard.py \
            tests/unit/test_budget_meters_rendered_sections.py \
            tests/unit/test_tool_wiring_parity.py \
            tests/unit/test_model_capability_wiring.py
        env:
          OPENAI_API_KEY: "sk-test-placeholder"
          CHROMA_DEVICE: "cpu"

      - name: Upload repo-wide guard receipts
        uses: actions/upload-artifact@v4
        with:
          name: repo-wide-guard-receipts
          path: receipts/repo-wide-guards.xml
          if-no-files-found: error
          retention-days: 30

      - name: Run fast test suite
        run: |
          python -m pytest -q -m "not slow and not benchmark and not semantic" --tb=short
        env:
          OPENAI_API_KEY: "sk-test-placeholder"
          CHROMA_DEVICE: "cpu"

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Test (Vitest — component/state behaviour lane, F07/T09)
        working-directory: web
        run: npm test

  bug-class-gate:
    name: bug-class-gate
    needs: [bug-class-scan, test, frontend]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require every dependency job to conclude success
        env:
          SCAN_RESULT: ${{ needs.bug-class-scan.result }}
          TEST_RESULT: ${{ needs.test.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          set -euo pipefail
          status=0
          for pair in "bug-class-scan=$SCAN_RESULT" "test=$TEST_RESULT" "frontend=$FRONTEND_RESULT"; do
            echo "$pair"
            if [ "${pair#*=}" != "success" ]; then status=1; fi
          done
          exit "$status"

      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download bug-class receipts
        uses: actions/download-artifact@v4
        with:
          name: bug-class-receipts
          path: receipts

      - name: Download repo-wide guard receipts
        uses: actions/download-artifact@v4
        with:
          name: repo-wide-guard-receipts
          path: receipts

      - name: Verify receipts against the checked-out policy, baseline and dispositions
        run: |
          set -euo pipefail
          python scripts/check_bug_classes.py verify-receipts --root . \
            --scan receipts/bug-class-scan.json --harness-junit receipts/bug-class-harness.xml \
            --guards-junit receipts/repo-wide-guards.xml --expect-sha "$GITHUB_SHA"
