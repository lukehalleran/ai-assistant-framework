# Daemon — project metadata + dependency declaration.
# This is an application, not a library: the wheel is never published.
# Install for development:
#     python3.11 -m venv venv && venv/bin/pip install -r requirements.txt
#     venv/bin/python -m spacy download en_core_web_sm
# Reproducible install (exact known-good versions from the dev machine):
#     venv/bin/pip install -r requirements.lock.txt
# Frozen executable: pyinstaller daemon.spec --clean --noconfirm

[project]
name = "daemon"
version = "1.1.0"
description = "Conversational RAG system with 5-tier hierarchical memory (single-user desktop app)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
# Metadata-only: the app runs from the repo / PyInstaller bundle, not a wheel.
packages = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# Bug-focused floor, not a style regime (2026-08-28: first lint config at
# ~222K lines). Rules limited to shapes that are real bugs — syntax errors,
# undefined names, invalid comparisons/f-strings — so the gate stays green
# and violations are always worth fixing. Broaden deliberately, not by default.
target-version = "py311"
extend-exclude = ["venv", "data", "integration.bak", "web", "build", "dist"]

[tool.ruff.lint]
select = [
    "E9",   # syntax errors / io errors
    "F63",  # invalid comparisons (is-literal, ==/!= on unsized)
    "F7",   # syntax-adjacent (return outside function, etc.)
    "F82",  # undefined names
    "F811", # redefined-while-unused (shadowed test/function definitions)
    "F601", "F602",  # is-comparisons to str/int literals
    "B002", "B006",  # ++n typo, mutable default args
]

[tool.pyright]
# Static lane (docs/PLAN_20260916_typecheck_lane.md). Default ("standard") checking
# mode — the measured baseline is default-mode output; do not change the mode
# without regenerating config/typecheck_baseline.json.
pythonVersion = "3.11"
pythonPlatform = "Linux"
include = ["core", "memory", "knowledge", "utils", "gui", "api", "models", "processing", "config", "main.py"]
exclude = ["venv", "**/venv", "data", "web", "integration.bak", "build", "dist", "scripts", "tests", "agent_branch", "**/__pycache__"]
typeCheckingMode = "standard"
# Missing third-party stubs are an environment fact, not a code defect (2 rows).
reportMissingImports = "none"
reportMissingModuleSource = "none"
