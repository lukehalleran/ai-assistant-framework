# docker-compose.yml
# Docker Compose configuration for Daemon RAG Agent
# Provides production-ready deployment with persistent storage and health monitoring

version: '3.8'

services:
  # ============================================================================
  # GUI Service (Default)
  # ============================================================================
  daemon-gui:
    image: daemon-rag-agent:latest
    container_name: daemon-rag-gui

    # Build configuration (if image not pre-built)
    build:
      context: .
      dockerfile: Dockerfile

    # Port mappings
    # 2026-09-27 (class: BC-71): the default "gui" mode serves FastAPI + the
    # built SPA on 8000 (config/app_config.py API_HOST/API_PORT), not the
    # legacy Gradio 7860. 7860 is still mapped because a FIRST RUN (no
    # profile yet, gui/launch.py::check_first_run) or an explicit
    # `--legacy-gui` falls back to standalone Gradio on that port.
    ports:
      - "8000:8000"  # FastAPI + React SPA (primary)
      - "7860:7860"  # First-run setup wizard / --legacy-gui fallback only

    # Environment variables
    # Load from .env file in project root
    env_file:
      - .env

    # Additional environment overrides
    environment:
      # FastAPI server (0.0.0.0 so Docker's port mapping can reach the
      # process; the app's own config default is loopback-only, see the
      # Dockerfile comment on DAEMON_API_HOST)
      DAEMON_API_HOST: 0.0.0.0
      DAEMON_API_PORT: 8000

      # Legacy/first-run Gradio server settings
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_PORT: 7860

      # ChromaDB device (cpu or cuda)
      CHROMA_DEVICE: cpu

      # Hugging Face offline mode (models pre-downloaded in image)
      HF_HUB_OFFLINE: 1
      HF_HOME: /app/data/cache/huggingface

      # Pinned so the entrypoint's directory pre-check and the app's actual
      # config/config.yaml default (memory.corpus_file/chroma_path) agree —
      # 2026-09-27: docker-entrypoint.sh's own fallback default names a
      # `chroma_db_v4_v2` path that no longer matches config.yaml
      # (`chroma_db_v4`); setting it here overrides that stale fallback.
      CORPUS_FILE: /app/data/corpus_v4.json
      CHROMA_PATH: /app/data/chroma_db_v4

    # Volume mounts for persistent data
    volumes:
      # Main data directory (corpus, ChromaDB, cache)
      - daemon-data:/app/data

      # Conversation logs (optional, for debugging)
      - daemon-logs:/app/conversation_logs

      # Custom configuration (optional override)
      # Uncomment to use host config instead of container defaults
      # - ./config:/app/config:ro

      # Custom .env file (alternative to env_file)
      # - ./.env:/app/.env:ro

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4.0'       # Max 4 CPU cores
          memory: 8G        # Max 8GB RAM
        reservations:
          cpus: '2.0'       # Reserve 2 CPU cores
          memory: 4G        # Reserve 4GB RAM

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Restart policy
    restart: unless-stopped

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Default command (GUI mode)
    command: ["gui"]

  # ============================================================================
  # CLI Service (Alternative - disabled by default)
  # ============================================================================
  # Uncomment to run CLI mode instead of GUI
  # daemon-cli:
  #   image: daemon-rag-agent:latest
  #   container_name: daemon-rag-cli
  #
  #   env_file:
  #     - .env
  #
  #   volumes:
  #     - daemon-data:/app/data
  #     - daemon-logs:/app/conversation_logs
  #
  #   stdin_open: true    # Keep STDIN open
  #   tty: true           # Allocate pseudo-TTY
  #
  #   restart: "no"       # Don't auto-restart CLI
  #
  #   command: ["cli"]

# ============================================================================
# Named Volumes
# ============================================================================
volumes:
  # Persistent data volume
  # Contains: corpus JSON, ChromaDB, Hugging Face cache, Wikipedia indices
  daemon-data:
    driver: local
    # Optional: Use specific host path for data
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /path/to/host/data

  # Conversation logs volume
  daemon-logs:
    driver: local

# ============================================================================
# Networks (optional - using default bridge network)
# ============================================================================
# networks:
#   daemon-network:
#     driver: bridge

# ============================================================================
# Usage Instructions
# ============================================================================
#
# Build and start:
#   docker-compose up -d
#
# View logs:
#   docker-compose logs -f daemon-gui
#
# Stop services:
#   docker-compose down
#
# Stop and remove volumes:
#   docker-compose down -v
#
# Rebuild image:
#   docker-compose build
#
# Run CLI mode (interactive):
#   docker-compose run --rm daemon-gui cli
#
# Access health check:
#   curl http://localhost:8000/health
#
# Inspect volumes:
#   docker volume ls
#   docker volume inspect daemon-rag-agent_daemon-data
#
# ============================================================================
# Environment Variables
# ============================================================================
#
# Required in .env file:
#   - OPENAI_API_KEY (or other LLM provider API key)
#
# Optional overrides:
#   - CORPUS_FILE (default: /app/data/corpus_v4.json)
#   - CHROMA_PATH (default: /app/data/chroma_db_v4 — pinned above; see the
#     comment on the `environment:` block for why)
#   - MODEL_MAX_TOKENS (default: 4096)
#   - PROMPT_TOKEN_BUDGET (default: 10000; floor 8000, ceiling 16000 —
#     config.yaml token_budget)
#
# See .env.example for full list of 105+ configuration options
#
# ============================================================================
# GPU Support (Optional)
# ============================================================================
#
# To enable GPU support for ChromaDB and transformers:
#
# 1. Install nvidia-docker2:
#    https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
#
# 2. Modify daemon-gui service:
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: 1
#              capabilities: [gpu]
#
# 3. Set environment variable:
#    CHROMA_DEVICE: cuda
#
# ============================================================================
