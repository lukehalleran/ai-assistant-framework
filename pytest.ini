[pytest]
# Where to look for tests
testpaths = tests

# Patterns for test files
python_files = test_*.py *_test.py

# Patterns for test functions
python_functions = test_*

# Don't search these directories (exclude external dependencies)
norecursedirs =
    .git
    .venv
    venv
    env
    __pycache__
    *.egg-info
    chroma_db
    data
    conversation_logs
    devtools
    scripts
    htmlcov
    .pytest_cache

# Show extra test summary info
addopts =
    -ra
    --strict-markers
    --color=yes
    --tb=short

# Custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    semantic: marks tests as requiring semantic model (may be slow or skipped)
    benchmark: Retrieval quality benchmarks (slow, loads real embedding model)

# Async support
asyncio_mode = auto

# Coverage settings
[coverage:run]
source = .
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
    */data/*
    setup.py
    sitecustomize.py

[coverage:report]
# Show lines that weren't covered
show_missing = True
# Skip files with 100% coverage in reports
skip_covered = False
# Precision for coverage percentage
precision = 2
